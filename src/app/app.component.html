<a class="skip-link" href="#proyectos">{{ i18n.t().skipLink }}</a>

<app-tech-cursor />

<main>
  @if (narrative.currentPhase() === 'ORBIT') {
  <!-- Three.js sale del bundle inicial: solo lo baja quien entra a la vista orbital. -->
  @defer (on immediate) {
  <app-holo-rebirth />
  } @loading {
  <p class="phase-loading">{{ i18n.t().orbitView }}…</p>
  }
  } @else {
  <!-- La interfaz se monta tambien durante el arranque: asi el LCP es el hero
       real y no el cargador. -->
  <app-main-interface />
  }

  @if (narrative.currentPhase() === 'BOOT') {
  <app-boot-sequence />
  }
</main>

<!-- Fuera de <main>: las ventanas viven igual en la interfaz que en el orbital. -->
<app-window-layer />
<app-command-palette />
