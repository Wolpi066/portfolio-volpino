<div class="orbit">

  <div class="canvas" #canvasHost (pointerdown)="onPointerDown($event)" (pointerup)="onPointerUp($event)"
    (pointermove)="onPointerMove($event)"></div>

  <div class="hud">
    <div class="hud-tl">
      <h1 class="o-title">{{ i18n.t().orbitView }}</h1>
      <ul class="legend">
        <li><span class="k live" aria-hidden="true"></span>{{ i18n.t().legendLive }}</li>
        <li><span class="k work" aria-hidden="true"></span>{{ i18n.t().legendWeb }}</li>
        <li><span class="k arch" aria-hidden="true"></span>{{ i18n.t().legendGame }}</li>
      </ul>
    </div>

    <button type="button" class="btn o-exit" (click)="exit()">
      {{ i18n.t().orbitExit }}
    </button>

    <p class="hints">
      <span>{{ i18n.t().hintDrag }}</span>
      <span>{{ i18n.t().hintTap }}</span>
    </p>

    <!-- El nombre del nodo bajo el puntero: sin esto hay que tantear a ciegas. -->
    <p class="readout" [class.on]="hovered()" aria-live="polite">{{ hovered() }}</p>
  </div>
</div>
